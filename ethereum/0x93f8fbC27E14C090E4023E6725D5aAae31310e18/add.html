<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Add token</title>
</head>
<body>
  <img id="logo" alt="" width="64" height="64">
  <h1 id="name"></h1>
  <p id="symbol"></p>
  <button id="add" type="button">Add to wallet</button>
  <p id="status"></p>
  <script id="token" type="application/json">{"address": "0x93f8fbC27E14C090E4023E6725D5aAae31310e18", "name": "Tether USD", "symbol": "USDT", "decimals": 6, "image": "https://jpleorx.github.io/exp1/ethereum/0x93f8fbC27E14C090E4023E6725D5aAae31310e18/logo.png", "chainId": 11155111}</script>
  <script>
    const token = JSON.parse(document.getElementById("token").textContent);
    document.getElementById("name").textContent = token.name;
    document.getElementById("symbol").textContent = token.symbol;
    document.getElementById("logo").src = token.image;
    document.getElementById("logo").alt = token.symbol;
    document.getElementById("add").addEventListener("click", async () => {
      const status = document.getElementById("status");
      const ethereum = window.ethereum;
      if (!ethereum) {
        status.textContent = "No wallet found.";
        return;
      }
      const chainHex = "0x" + token.chainId.toString(16);
      const current = await ethereum.request({ method: "eth_chainId" });
      if (current.toLowerCase() !== chainHex.toLowerCase()) {
        await ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: chainHex }]
        });
      }
      await ethereum.request({
        method: "wallet_watchAsset",
        params: {
          type: "ERC20",
          options: {
            address: token.address,
            symbol: token.symbol,
            decimals: token.decimals,
            image: token.image
          }
        }
      });
      status.textContent = "Wallet request sent.";
    });
  </script>
</body>
</html>
